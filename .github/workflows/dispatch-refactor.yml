name: NCPD Patrol dispatch refactor
on:
  push:
    branches: ['git-checkout--b-refactor/cleanup']
    paths-ignore: ['releases/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncpd-dispatch-refactor-cleanup
  cancel-in-progress: true
jobs:
  verify-and-package:
    if: github.ref == 'refs/heads/git-checkout--b-refactor/cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install test runtime
        run: |
          python3 -m venv .ci-python
          .ci-python/bin/pip install 'lupa==2.6'
      - name: Compare against v0.17d, run integration suites and build full ZIP
        run: .ci-python/bin/python tools/build_dispatch_refactor_release.py
      - name: Commit verified branch test package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/NCPD_Patrol_v0.17d_Dispatch_Refactor_r1_TEST.zip releases/NCPD_Patrol_Dispatch_Refactor_r1_verification.json
          git diff --cached --quiet && exit 0
          git commit -m "Build verified dispatch refactor r1 test package"
          git push origin HEAD:git-checkout--b-refactor/cleanup
