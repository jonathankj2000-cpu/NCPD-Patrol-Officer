name: Dispatch briefings and rewards prototype
on:
  push:
    branches: [prototype/dispatch-briefings-v09b]
    paths-ignore:
      - 'releases/**'
      - 'archive/pc/mod/NCPDPatrol_Dispatch.archive'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dispatch-briefings-v09b
  cancel-in-progress: true
jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Install test runtime
        run: |
          python3 -m venv .ci-python
          .ci-python/bin/pip install 'lupa==2.6'
      - name: Test authored code, build journal assets, and verify install ZIP
        run: .ci-python/bin/python tools/build_journal_release.py
      - name: Commit verified package on prototype branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/pc/mod/NCPDPatrol_Dispatch.archive releases/NCPD_Patrol_v0.9b_Dispatch_Briefings_Rewards_TEST.zip releases/NCPD_Patrol_v0.9b_verification.json
          git diff --cached --quiet && exit 0
          git commit -m "Build verified v0.9b dispatch briefings and rewards package"
          git push origin HEAD:prototype/dispatch-briefings-v09b
