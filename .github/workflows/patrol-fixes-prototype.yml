name: NCPD Patrol terrain, VIP and ambush fixes
on:
  push:
    branches: [prototype/ncpd-terrain-vip-fixes-v016d]
    paths-ignore: ['releases/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncpd-terrain-vip-fixes-v016d
  cancel-in-progress: true
jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install test runtime
        run: |
          python3 -m venv .ci-python
          .ci-python/bin/pip install 'lupa==2.6'
      - name: Verify terrain arrests, native body pickup, VIP fallback, bridge ambush and existing gameplay; build full ZIP
        run: |
          .ci-python/bin/python tools/build_patrol_fixes_release.py
      - name: Commit verified prototype package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/NCPD_Patrol_v0.16d_Terrain_VIP_Ambush_Fixes_TEST.zip releases/NCPD_Patrol_v0.16d_verification.json
          git diff --cached --quiet && exit 0
          git commit -m "Build verified v0.16d terrain, VIP and ambush test package"
          git push origin HEAD:prototype/ncpd-terrain-vip-fixes-v016d
