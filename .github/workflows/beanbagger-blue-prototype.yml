name: NCPD Bean Bagger blue grip prototype
on:
  push:
    branches: [prototype/ncpd-beanbagger-blue-v016b]
    paths-ignore: ['releases/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncpd-beanbagger-blue-v016b
  cancel-in-progress: true
jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install test runtime
        run: |
          python3 -m venv .ci-python
          .ci-python/bin/pip install 'lupa==2.6'
      - name: Verify Bean Bagger, career migration, shift entry and gameplay; build full ZIP
        run: |
          .ci-python/bin/python tools/materialize_beanbagger_upload.py
          .ci-python/bin/python tools/build_beanbagger_visual_release.py
      - name: Commit verified prototype package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/NCPD_Patrol_v0.16b_Bean_Bagger_Blue_Grips_TEST.zip releases/NCPD_Patrol_v0.16b_verification.json
          git add archive/pc/mod/NCPDPatrol_BeanBagger.archive assets/beanbagger/visuals
          git add -u
          git diff --cached --quiet && exit 0
          git commit -m "Build verified v0.16b Bean Bagger blue grip test package"
          git push origin HEAD:prototype/ncpd-beanbagger-blue-v016b
