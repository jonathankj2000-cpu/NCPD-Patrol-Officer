name: NCPD VIP transport and tyre repair prototype
on:
  push:
    branches: [prototype/ncpd-vip-v014a]
    paths-ignore: ['releases/**', 'archive/pc/mod/NCPDPatrol_VIP.archive']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncpd-vip-v014a
  cancel-in-progress: true
jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install test runtime
        run: |
          python3 -m venv .ci-python
          .ci-python/bin/pip install 'lupa==2.6'
      - name: Verify VIP, ambush, tyres and existing gameplay; build assets and full ZIP
        run: .ci-python/bin/python tools/build_vip_release.py
      - name: Commit verified prototype package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/pc/mod/NCPDPatrol_VIP.archive releases/NCPD_Patrol_v0.14a_VIP_Transport_Tyre_Repair_TEST.zip releases/NCPD_Patrol_v0.14a_verification.json
          git diff --cached --quiet && exit 0
          git commit -m "Build verified v0.14a VIP transport and tyre repair test package"
          git push origin HEAD:prototype/ncpd-vip-v014a
