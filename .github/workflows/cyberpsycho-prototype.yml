name: NCPD cyberpsycho dispatch prototype
on:
  push:
    branches: [prototype/ncpd-cyberpsycho-v013a]
    paths-ignore: ['releases/**', 'archive/pc/mod/NCPDPatrol_Cyberpsycho.archive']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncpd-cyberpsycho-v013a
  cancel-in-progress: true
jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install test runtime
        run: |
          python3 -m venv .ci-python
          .ci-python/bin/pip install 'lupa==2.6'
      - name: Verify encounter and existing gameplay; build assets and full ZIP
        run: .ci-python/bin/python tools/build_cyberpsycho_release.py
      - name: Commit verified prototype package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/pc/mod/NCPDPatrol_Cyberpsycho.archive releases/NCPD_Patrol_v0.13a_Cyberpsycho_Dispatch_TEST.zip releases/NCPD_Patrol_v0.13a_verification.json
          git diff --cached --quiet && exit 0
          git commit -m "Build verified v0.13a cyberpsycho encounter test package"
          git push origin HEAD:prototype/ncpd-cyberpsycho-v013a
